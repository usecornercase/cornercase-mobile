[package]
name = "tauri-plugin-secrets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
links = "tauri-plugin-secrets"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dependencies]
cornercase-core = { path = "../../../crates/core" }
tauri = "2.12"

[target.'cfg(target_os = "android")'.dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
rstest = "0.28.0"
tauri = { version = "2.12", features = ["test"] }

[lints]
workspace = true
