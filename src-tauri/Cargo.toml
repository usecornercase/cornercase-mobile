[package]
name = "cornercase-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "cornercase_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cornercase-core = { path = "../crates/core", features = ["specta"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { workspace = true }
tauri = { version = "2.12", features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tauri-plugin-keyboard = { path = "plugins/keyboard" }
tauri-plugin-network = { path = "plugins/network" }
tauri-plugin-opener = "2.7.3"
tauri-plugin-photos = { path = "plugins/photos" }
tauri-plugin-secrets = { path = "plugins/secrets" }
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"
tauri-plugin-haptics = "2.4.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring-core = "1.0.1"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[dev-dependencies]
cornercase-core = { path = "../crates/core", features = ["test-util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
keyring-core = "1.0.1"
rstest = "0.28.0"
specta-typescript = "=0.0.13"
tauri = { version = "2.12", features = ["test"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
tokio = { version = "1.54.1", features = ["rt", "test-util"] }

[lints]
workspace = true
