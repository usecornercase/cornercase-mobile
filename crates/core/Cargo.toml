[package]
name = "cornercase-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { workspace = true, optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
zeroize = "1.9.1"

[features]
specta = ["dep:specta"]
test-util = ["tokio/rt"]

[dev-dependencies]
cornercase-core = { path = ".", features = ["test-util"] }
rstest = "0.28.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "test-util"] }

[lints]
workspace = true
